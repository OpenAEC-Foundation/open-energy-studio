[package]
name = "open-energy-studio"
version = "0.1.6-alpha"
description = "BENG calculator for building energy performance according to NTA 8800"
authors = ["Open Energy Studio Contributors"]
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "open-energy-studio"
path = "src/main.rs"

[[bin]]
name = "schema-export"
path = "src/bin/schema_export.rs"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
# Core Tauri stack
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
thiserror = "2"
tauri = { version = "2.10.3", features = ["image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"

# NTA 8800 calculation engine (via vendor/crates-warehouse git submodule).
# openaec-project-shared transitively pulls in the nta8800-* dependencies we
# need; we add the per-domain crates individually in Step 3 when we wire the
# per-domain commands.
isso51-core = { path = "../vendor/crates-warehouse/isso51-core" }
openaec-project-shared = { path = "../vendor/crates-warehouse/openaec-project-shared" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Graphics_Printing",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
