[package]
name = "open-energy-studio"
version = "2026.2.0"
description = "BENG calculator for building energy performance according to NTA 8800"
authors = ["Open Energy Studio Contributors"]
license = "LGPL-3.0-or-later"
repository = "https://github.com/OpenAEC-Foundation/open-energy-studio"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.0", features = ["image-png"] }
tauri-plugin-log = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
