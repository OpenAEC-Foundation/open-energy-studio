name: CI

# Runs the same gate as locally (scripts/verify-nta.sh): release notes and
# manual stamp, rustfmt/tests/clippy for the kernel and service, the reference
# suites, the kernel on Rust 1.77.2 (MSRV), the Tauri check and command tests,
# TypeScript, the UI tests with the project-form guard, and the frontend
# bundle. Then it builds the desktop installers per platform as artifacts.
# Releases come from release tags only (see release.yml), not from this file.

on:
  push:
    branches: [main, nta8800-kernel]
  pull_request:
    branches: [main, nta8800-kernel]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable with Clippy and rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Rust 1.77.2 (kernel MSRV)
        run: rustup toolchain install 1.77.2 --profile minimal

      - name: Rust cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            crates/nta8800-core/target/
            crates/nta8800-service/target/
            src-tauri/target/
            target/msrv-core/
          key: ${{ runner.os }}-gate-${{ hashFiles('crates/*/Cargo.lock', 'src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-gate-

      - name: Install system dependencies (Tauri check)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      # No separate `npm run build` here: the gate builds the frontend itself
      # before the Tauri check, exactly as in a fresh local checkout.
      - name: NTA gate (scripts/verify-nta.sh)
        env:
          NTA_VITEST_MAX_WORKERS: '2'
        run: scripts/verify-nta.sh

      - name: Keep gate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-evidence
          path: nta-evidence/gate
          if-no-files-found: ignore
          retention-days: 30

  build:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
          - platform: 'windows-latest'
          - platform: 'macos-latest'

    runs-on: ${{ matrix.platform }}
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust targets (macOS universal)
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Rust cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npm run tauri:build

      - name: Sign Windows exe and installer with Azure Trusted Signing
        if: matrix.platform == 'windows-latest' && env.AZURE_CLIENT_ID != ''
        uses: azure/trusted-signing-action@v1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          files-folder: src-tauri/target/release
          files-folder-filter: exe
          files-folder-depth: 4
          cache-dependencies: false

      - name: Upload artifacts (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload artifacts (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v7
        with:
          name: linux-installer
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload artifacts (macOS)
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v7
        with:
          name: macos-installer
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
          retention-days: 30
          if-no-files-found: ignore
