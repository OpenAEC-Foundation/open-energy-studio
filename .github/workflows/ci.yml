name: CI

# Runs the same gate as locally (scripts/verify-nta.sh): release notes and
# manual stamp, rustfmt/tests/clippy for the kernel and service, the reference
# suites, the kernel on Rust 1.77.2 (MSRV), the Tauri check and command tests,
# TypeScript, the UI tests with the project-form guard, and the frontend
# bundle. Then it builds the desktop installers per platform as artifacts.
# Releases come from release tags only (see release.yml), not from this file.

on:
  push:
    branches: [main, nta8800-kernel]
  pull_request:
    branches: [main, nta8800-kernel]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Python for build evidence checks
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Rust stable with Clippy and rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Rust 1.77.2 (kernel MSRV)
        run: rustup toolchain install 1.77.2 --profile minimal

      - name: Rust cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            crates/nta8800-core/target/
            crates/nta8800-service/target/
            src-tauri/target/
            target/msrv-core/
          key: ${{ runner.os }}-gate-${{ hashFiles('crates/*/Cargo.lock', 'src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-gate-

      - name: Install system dependencies (Tauri check)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      # No separate `npm run build` here: the gate builds the frontend itself
      # before the Tauri check, exactly as in a fresh local checkout.
      - name: NTA gate (scripts/verify-nta.sh)
        env:
          NTA_VITEST_MAX_WORKERS: '2'
        run: scripts/verify-nta.sh

      - name: Keep gate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-evidence
          path: nta-evidence/gate
          if-no-files-found: ignore
          retention-days: 30

  build:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
          - platform: 'windows-latest'
          - platform: 'macos-15-intel'

    runs-on: ${{ matrix.platform }}
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust targets (macOS universal)
        if: matrix.platform == 'macos-15-intel'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Rust cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Check Cargo after cache restore
        run: cargo --version

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        if: matrix.platform != 'macos-15-intel'
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npm run tauri:build

      # Match the release workflow: one DMG must contain both Mac architectures.
      - name: Build universal macOS DMG
        if: matrix.platform == 'macos-15-intel'
        run: npm run tauri:build -- --target universal-apple-darwin --bundles dmg

      - name: Verify both macOS architectures
        if: matrix.platform == 'macos-15-intel'
        shell: bash
        run: |
          set -euo pipefail
          binary=src-tauri/target/universal-apple-darwin/release/open-energy-studio
          archs="$(lipo -archs "$binary")"
          echo "Desktop binary architectures: $archs"
          [[ " $archs " == *" x86_64 "* && " $archs " == *" arm64 "* ]]

      - name: Sign Windows exe and installer with Azure Trusted Signing
        if: matrix.platform == 'windows-latest' && env.AZURE_CLIENT_ID != ''
        uses: azure/trusted-signing-action@v1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          files-folder: src-tauri/target/release
          files-folder-filter: exe
          files-folder-depth: 4
          cache-dependencies: false

      - name: Upload artifacts (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30
          if-no-files-found: error

      - name: Require both Linux installer formats
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          shopt -s nullglob
          debs=(src-tauri/target/release/bundle/deb/*.deb)
          appimages=(src-tauri/target/release/bundle/appimage/*.AppImage)
          if (( ${#debs[@]} == 0 || ${#appimages[@]} == 0 )); then
            echo 'Missing Linux .deb or AppImage build output' >&2
            exit 1
          fi

      - name: Upload artifacts (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v7
        with:
          name: linux-installer
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 30
          if-no-files-found: error

      - name: Upload artifacts (macOS)
        if: matrix.platform == 'macos-15-intel'
        uses: actions/upload-artifact@v7
        with:
          name: macos-installer
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 30
          if-no-files-found: error

  # The standalone workflow_dispatch file cannot run before it reaches the
  # default branch. An explicitly marked push can collect comparable evidence
  # from this branch without adding a debug build to every CI run.
  nta-build-evidence:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/nta8800-kernel' &&
      contains(github.event.head_commit.message, '[nta-evidence]')
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'

      - name: Pin npm for build evidence
        run: npm install --global npm@12.2.0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Check build evidence code
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Build NTA dev evidence from this commit
        run: python3 scripts/build-nta-fixed-layout.py --output-dir nta-evidence/remote-build

      - name: Verify bytes and source metadata
        run: |
          manifest="$(find nta-evidence/remote-build -maxdepth 1 -type f -name 'oes-nta8800-build_*.json' -print -quit)"
          test -n "$manifest"
          python3 scripts/verify-nta-build.py "$manifest" --source-repo .
          sha256sum "$manifest"

      - name: Upload NTA build evidence
        uses: actions/upload-artifact@v7
        with:
          name: nta-8800-linux-dev-build
          path: nta-evidence/remote-build/
          if-no-files-found: error
          retention-days: 30
