name: Build and Release

# Release builds for a pushed release tag. The tag is made locally by
# scripts/release-nta.sh: oes-v<program>-kernel-v<KERNEL_VERSION>, e.g.
# oes-v0.2.0-kernel-v0.3.0. Older v<program> tags still work.
#
# 1. verify  - the tag must match package.json and KERNEL_VERSION; then the
#              full NTA gate (scripts/verify-nta.sh, including Rust 1.77.2).
# 2. release - uses the GitHub release for the tag if it already exists
#              (its notes, e.g. from release/<tag>/github-release.md, are left
#              untouched); otherwise creates it as a draft pre-release.
# 3. build   - installers for Linux (deb, rpm, AppImage), macOS (universal
#              dmg) and Windows (NSIS, MSI), uploaded to that release; an
#              existing installer assets are rejected to avoid retaining unsigned bytes.
# 4. checksums - OpenPGP-sign and re-download/verify the final installer manifest.
# A draft created here stays a draft: publishing is a manual decision.

on:
  push:
    tags:
      - 'oes-v*'
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build (e.g. oes-v0.2.0-kernel-v0.3.0)'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Python for build evidence checks
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Tag matches program and kernel version
        shell: bash
        run: |
          set -euo pipefail
          program="$(node -p "require('./package.json').version")"
          kernel="$(node scripts/nta-kernel-version.mjs version)"
          case "$RELEASE_TAG" in
            oes-v*) expected="oes-v${program}-kernel-v${kernel}" ;;
            v*)     expected="v${program}" ;;
            *)      echo "Unknown tag form: $RELEASE_TAG" >&2; exit 1 ;;
          esac
          if [ "$RELEASE_TAG" != "$expected" ]; then
            echo "Tag $RELEASE_TAG does not match the sources (expected $expected)." >&2
            exit 1
          fi
          echo "Tag $RELEASE_TAG matches program $program and kernel $kernel."

      - name: Release notes and manual stamp
        run: |
          node scripts/nta-kernel-version.mjs check
          node scripts/nta-manual.mjs check

      # The same check scripts/release-nta.sh makes before tagging: released
      # sections of the release notes are unchanged since the previous tag.
      - name: Released sections unchanged since the previous release tag
        shell: bash
        run: |
          set -euo pipefail
          previous="$(git tag -l 'oes-v*-kernel-v*' --sort=-creatordate | grep -vxF "$RELEASE_TAG" | head -n 1 || true)"
          if [ -z "$previous" ] || ! git cat-file -e "${previous}:docs/nta8800-releasenotes.md" 2>/dev/null; then
            echo "No earlier release tag with release notes; nothing to compare."
            exit 0
          fi
          git show "${previous}:docs/nta8800-releasenotes.md" > "$RUNNER_TEMP/releasenotes-previous.md"
          node scripts/nta-kernel-version.mjs check-released "$RUNNER_TEMP/releasenotes-previous.md"

      - name: Install Rust stable with Clippy and rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Rust 1.77.2 (kernel MSRV)
        run: rustup toolchain install 1.77.2 --profile minimal

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/nta8800-core -> target
            crates/nta8800-service -> target
            src-tauri -> target

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      # No separate `npm run build`: the gate builds the frontend itself
      # before the Tauri check, exactly as scripts/release-nta.sh does.
      - name: NTA gate (scripts/verify-nta.sh)
        env:
          NTA_VITEST_MAX_WORKERS: '2'
        run: scripts/verify-nta.sh

      - name: Keep gate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-evidence-${{ env.RELEASE_TAG }}
          path: nta-evidence/gate
          if-no-files-found: ignore
          retention-days: 90

  signing-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Require the existing organization signing credentials
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
          WINDOWS_SIGNING_SUBJECT: ${{ vars.WINDOWS_SIGNING_SUBJECT }}
        run: python3 scripts/signing/credentials.py

  release:
    needs: [verify, signing-config]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Use the existing release or create a draft
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$REPO" > /dev/null 2>&1; then
            draft="$(gh release view "$RELEASE_TAG" --repo "$REPO" --json isDraft --jq .isDraft)"
            if [ "$draft" != true ]; then
              echo "Refusing to change an already published release. Create a new draft release/tag." >&2
              exit 1
            fi
            echo "Draft $RELEASE_TAG exists; its notes are left as they are."
          else
            gh release create "$RELEASE_TAG" --repo "$REPO" --verify-tag --draft --prerelease \
              --title "Open Energy Studio ${RELEASE_TAG}" \
              --notes "Draft created by the release workflow. Replace these notes with release/${RELEASE_TAG}/github-release.md from scripts/release-nta.sh before publishing. Open Energy Studio is not yet attested under BRL 9501."
          fi

  build:
    needs: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: '--bundles deb,rpm,appimage'
            bundles: 'deb rpm appimage'
          - platform: macos-15-intel
            args: '--target universal-apple-darwin --bundles dmg'
            bundles: 'dmg'
          - platform: windows-latest
            args: '--config src-tauri/tauri.release.windows.conf.json --bundles nsis,msi'
            bundles: 'nsis msi'
    runs-on: ${{ matrix.platform }}
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
      AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
      AZURE_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WINDOWS_SIGNING_SUBJECT: ${{ vars.WINDOWS_SIGNING_SUBJECT }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust targets (macOS universal)
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install the Microsoft Artifact Signing module
        if: runner.os == 'Windows'
        shell: pwsh
        run: Install-Module ArtifactSigning -RequiredVersion 0.1.20 -Scope CurrentUser -Force -Repository PSGallery

      - name: Import the existing Developer ID certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: scripts/signing/macos-prepare.sh

      - name: Build installers
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npm run tauri:build -- ${{ matrix.args }}

      - name: Verify both macOS architectures
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          binary=src-tauri/target/universal-apple-darwin/release/open-energy-studio
          archs="$(lipo -archs "$binary")"
          echo "Desktop binary architectures: $archs"
          [[ " $archs " == *" x86_64 "* && " $archs " == *" arm64 "* ]]

      - name: Sign and notarize the DMG container
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          for dmg in src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg; do
            codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp "$dmg"
            xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
            xcrun stapler staple "$dmg"
            scripts/signing/macos-verify.sh "$dmg"
          done

      - name: Upload installers to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          if [ "$RUNNER_OS" = "macOS" ]; then
            root="src-tauri/target/universal-apple-darwin/release/bundle"
          else
            root="src-tauri/target/release/bundle"
          fi
          files=()
          for kind in ${{ matrix.bundles }}; do
            for f in "$root/$kind"/*.deb "$root/$kind"/*.rpm "$root/$kind"/*.AppImage \
                     "$root/$kind"/*.dmg "$root/$kind"/*-setup.exe "$root/$kind"/*.msi; do
              files+=("$f")
            done
          done
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No installers found under $root" >&2
            exit 1
          fi
          # Never retain an older installer without verifying its payload. This
          # workflow uses a fresh draft; local release-nta.sh packages stay in the
          # local evidence archive, not pre-uploaded as release installers.
          existing="$(gh release view "$RELEASE_TAG" --repo "$REPO" --json assets --jq '.assets[].name')"
          upload=()
          for f in "${files[@]}"; do
            name="$(basename "$f")"
            name="${name// /.}"
            if grep -qxF -- "$name" <<< "$existing"; then
              echo "Refusing to keep an unverified existing installer $name. Use a fresh draft/tag." >&2
              exit 1
            else
              upload+=("$f")
            fi
          done
          if [ "${#upload[@]}" -eq 0 ]; then
            echo "All installers of this platform are already on the release."
            exit 0
          fi
          printf 'Uploading %s\n' "${upload[@]}"
          gh release upload "$RELEASE_TAG" "${upload[@]}" --repo "$REPO"

      - name: Download the offered Windows installers and check installed files
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'release-downloads'
          New-Item -ItemType Directory -Path $directory | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern '*.exe' --pattern '*.msi' --dir $directory
          if ($LASTEXITCODE -ne 0) { throw 'Release download failed.' }
          ./scripts/signing/windows-install-check.ps1 -Directory $directory

      - name: Download and verify the offered macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/release-downloads"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.dmg' --dir "$RUNNER_TEMP/release-downloads"
          for dmg in "$RUNNER_TEMP/release-downloads/"*.dmg; do scripts/signing/macos-verify.sh "$dmg"; done

      - name: Remove the temporary macOS signing keychain
        if: always() && runner.os == 'macOS'
        run: security delete-keychain "$RUNNER_TEMP/oes-signing.keychain-db"

  checksums:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Download every installer and sign the final checksum manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          mkdir installers && cd installers
          for pattern in '*.deb' '*.rpm' '*.AppImage' '*.dmg' '*.exe' '*.msi'; do
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$pattern"
          done
          "$GITHUB_WORKSPACE/scripts/signing/linux-manifest.sh"
          gh release upload "$RELEASE_TAG" SHA256SUMS-installers.txt SHA256SUMS-installers.txt.asc OpenAEC-release-signing.asc --repo "$GITHUB_REPOSITORY"

      - name: Independently verify downloaded signatures, key and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir downloaded && cd downloaded
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          export GNUPGHOME
          GNUPGHOME="$(mktemp -d)"
          trap 'rm -rf "$GNUPGHOME"' EXIT
          gpg --batch --import OpenAEC-release-signing.asc
          gpg --batch --export 13F6D414ADEE4ED4CD09AC60601D86C93C504D29 > trusted-key.gpg
          test -s trusted-key.gpg
          gpgv --keyring "$PWD/trusted-key.gpg" SHA256SUMS-installers.txt.asc SHA256SUMS-installers.txt
          python3 "$GITHUB_WORKSPACE/scripts/signing/manifest.py" verify .
          echo 'All signing gates passed; release remains a draft for manual publication.' >> "$GITHUB_STEP_SUMMARY"
