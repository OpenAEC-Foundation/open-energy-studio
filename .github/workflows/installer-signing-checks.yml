name: Installer signing checks
on:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/installer-signing-checks.yml'
      - 'scripts/signing/**'
      - 'src-tauri/tauri.release.windows.conf.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/installer-signing-checks.yml'
      - 'scripts/signing/**'
      - 'src-tauri/tauri.release.windows.conf.json'
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 -m unittest discover -s scripts/signing -p 'test_*.py' -v
      - run: for script in scripts/signing/*.sh; do bash -n "$script"; done
      - shell: pwsh
        run: ./scripts/signing/test-windows-verify.ps1
