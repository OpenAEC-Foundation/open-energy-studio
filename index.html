<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open Energy Studio</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta http-equiv="Cache-Control" content="no-cache" />
    <script>
      // After a deploy a cached copy of this page can point at a script that no longer
      // exists (blank page). When the app script does not start, reload once from the
      // server; the flag in sessionStorage prevents a reload loop.
      (function () {
        var KEY = 'oes.reloadedForStaleAssets';
        function reload() {
          try { if (sessionStorage.getItem(KEY)) return; sessionStorage.setItem(KEY, '1'); } catch (e) { return; }
          var url = new URL(location.href); url.searchParams.set('v', String(Date.now())); location.replace(url.toString());
        }
        window.addEventListener('error', function (event) {
          var target = event.target;
          if (target && target.tagName === 'SCRIPT' && (target.src || '').indexOf('/assets/') >= 0) reload();
        }, true);
        window.setTimeout(function () { if (!window.__oesStarted) reload(); }, 8000);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
