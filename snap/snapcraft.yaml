name: open-energy-studio
base: core22
version: 0.0.0
title: Open Energy Studio
summary: Open Energy Studio for Linux
description: Open Energy Studio. This Snap packages the published OpenAEC release with its approved app
  logo.
grade: stable
confinement: strict
icon: src-tauri/icons/icon.png
architectures:
- amd64
apps:
  open-energy-studio:
    command: usr/bin/open-energy-studio
    extensions:
    - gnome
    desktop: usr/share/applications/open-energy-studio.desktop
    plugs:
    - home
    - removable-media
    - network
    - browser-support
parts:
  open-energy-studio:
    plugin: nil
    stage-packages:
    - libappindicator3-1
    override-build: 'set -eu

      dpkg-deb -x "${CRAFT_PROJECT_DIR}/release.deb" "${CRAFT_PART_INSTALL}"

      python3 "${CRAFT_PROJECT_DIR}/snap/prepare-desktop.py" "${CRAFT_PART_INSTALL}"

      '
