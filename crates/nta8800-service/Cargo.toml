[package]
name = "nta8800-service"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "LGPL-3.0-or-later"
description = "HTTP API and MCP adapters for the Open Energy Studio Rust kernel"

[dependencies]
nta8800-core = { path = "../nta8800-core" }
nta8800-operations = { path = "../nta8800-operations" }
axum = "0.8"
rmcp = { version = "3.5", default-features = false, features = ["server", "macros", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-std", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
