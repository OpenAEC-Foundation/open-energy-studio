[package]
name = "nta8800-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
license = "LGPL-3.0-or-later"
description = "Norm-versioned NTA 8800 calculation kernel for Open Energy Studio"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
sha2 = "0.10"
rust_decimal = { version = "=1.40.0", default-features = false, features = ["std"] }
